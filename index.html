<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hana's Gallery — A Permanent Collection</title>
<meta name="description" content="A permanent collection of original works in crayon, marker, paint, and glitter glue." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --wall:#F6F4EE;            /* gallery wall */
    --wall-deep:#EDEAE1;
    --ink:#26241F;             /* charcoal ink */
    --ink-soft:#6E6A60;
    --card:#FFFFFF;
    --crayon-red:#E64832;
    --crayon-blue:#2E7DB2;
    --crayon-yellow:#F5C31D;
    --crayon-green:#3E9B57;
    --tape:rgba(245,195,29,.55);
    --shadow:0 10px 24px rgba(38,36,31,.10), 0 2px 6px rgba(38,36,31,.08);
    --serif:'Libre Caslon Text', Georgia, serif;
    --hand:'Schoolbell', cursive;
    --sans:'Karla', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--wall);
    background-image:radial-gradient(rgba(38,36,31,.035) 1px, transparent 1px);
    background-size:26px 26px;
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
  }
  img{max-width:100%; display:block;}
  button{font:inherit; cursor:pointer;}

  /* ============ HEADER ============ */
  header{
    text-align:center;
    padding:64px 20px 36px;
    border-bottom:3px double var(--ink);
    max-width:920px;
    margin:0 auto;
  }
  .est{
    font-family:var(--serif);
    font-size:13px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .est::before,.est::after{content:"—"; margin:0 10px; color:var(--crayon-red);}
  h1{
    font-family:var(--hand);
    font-weight:400;
    font-size:clamp(52px, 9vw, 96px);
    line-height:1.05;
    margin:14px 0 6px;
  }
  h1 .underline{
    background:linear-gradient(transparent 78%, var(--tape) 78%);
    padding:0 .08em;
  }
  .subtitle{
    font-family:var(--serif);
    font-style:italic;
    font-size:clamp(16px, 2.4vw, 20px);
    color:var(--ink-soft);
    max-width:560px;
    margin:0 auto;
  }
  .now-showing{
    display:inline-block;
    margin-top:26px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--card);
    background:var(--ink);
    padding:8px 18px;
    transform:rotate(-1.5deg);
  }
  .now-showing b{color:var(--crayon-yellow); font-weight:700;}

  /* ============ FILTERS ============ */
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    padding:30px 20px 8px;
  }
  .pill{
    border:1.5px solid var(--ink);
    background:var(--card);
    color:var(--ink);
    border-radius:999px;
    padding:6px 18px;
    font-size:14px;
    font-weight:500;
    transition:transform .15s ease, background .15s ease;
  }
  .pill:hover{transform:translateY(-2px);}
  .pill[aria-pressed="true"]{
    background:var(--ink);
    color:var(--wall);
  }
  .pill:focus-visible, .art-card:focus-visible, .lb-btn:focus-visible{
    outline:3px solid var(--crayon-blue);
    outline-offset:3px;
  }

  /* ============ GALLERY WALL ============ */
  .wall{
    max-width:1180px;
    margin:0 auto;
    padding:36px 24px 90px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:56px 40px;
    align-items:start;
  }
  .art-card{
    background:none;
    border:none;
    text-align:left;
    display:block;
    width:100%;
    transition:transform .2s ease;
  }
  .art-card:nth-child(3n+1){transform:rotate(-1.1deg);}
  .art-card:nth-child(3n+2){transform:rotate(.9deg);}
  .art-card:nth-child(3n){transform:rotate(-.4deg);}
  .art-card:hover{transform:rotate(0deg) translateY(-4px);}
  .frame{
    position:relative;
    background:var(--card);
    padding:14px;
    box-shadow:var(--shadow);
  }
  .frame::before{ /* washi tape */
    content:"";
    position:absolute;
    top:-12px;
    left:50%;
    width:96px;
    height:26px;
    transform:translateX(-50%) rotate(-2deg);
    background:var(--tape);
    box-shadow:0 1px 2px rgba(38,36,31,.12);
  }
  .art-card:nth-child(4n+2) .frame::before{background:rgba(230,72,50,.45); transform:translateX(-50%) rotate(2.5deg);}
  .art-card:nth-child(4n+3) .frame::before{background:rgba(46,125,178,.40); transform:translateX(-50%) rotate(-3deg);}
  .art-card:nth-child(4n) .frame::before{background:rgba(62,155,87,.42); transform:translateX(-50%) rotate(1.5deg);}
  .frame .thumb{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    background:var(--wall-deep);
  }
  .video-badge{
    position:absolute;
    right:24px;
    bottom:96px;
    width:44px;height:44px;
    border-radius:50%;
    background:rgba(38,36,31,.85);
    display:flex;align-items:center;justify-content:center;
  }
  .video-badge svg{width:18px;height:18px;fill:var(--wall);margin-left:3px;}

  /* museum placard */
  .placard{
    background:var(--card);
    border-left:4px solid var(--crayon-red);
    margin:10px 14px 0;
    padding:12px 14px;
    box-shadow:0 3px 10px rgba(38,36,31,.07);
  }
  .art-card:nth-child(3n+2) .placard{border-left-color:var(--crayon-blue);}
  .art-card:nth-child(3n) .placard{border-left-color:var(--crayon-green);}
  .placard .cat{
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .placard .title{
    font-family:var(--serif);
    font-weight:700;
    font-size:17px;
    line-height:1.3;
    margin:2px 0;
  }
  .placard .medium{
    font-family:var(--serif);
    font-style:italic;
    font-size:13.5px;
    color:var(--ink-soft);
  }

  /* ============ LIGHTBOX ============ */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(28,26,22,.92);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:50;
  }
  .lightbox.open{display:flex;}
  .lb-inner{
    background:var(--card);
    max-width:880px;
    width:100%;
    max-height:92vh;
    overflow:auto;
    padding:18px 18px 26px;
    box-shadow:var(--shadow);
  }
  .lb-media img{width:100%; max-height:62vh; object-fit:contain; background:var(--wall-deep);}
  .lb-media .video-wrap{position:relative; width:100%; padding-top:56.25%; background:#000;}
  .lb-media iframe, .lb-media video{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .lb-caption{padding:18px 6px 0;}
  .lb-caption .cat{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft);}
  .lb-caption h2{font-family:var(--serif); font-size:26px; margin:4px 0 2px;}
  .lb-caption .medium{font-family:var(--serif); font-style:italic; color:var(--ink-soft); margin-bottom:10px;}
  .lb-caption .note{font-size:15.5px; max-width:64ch;}
  .lb-controls{
    display:flex;
    justify-content:space-between;
    margin-top:16px;
  }
  .lb-btn{
    border:1.5px solid var(--ink);
    background:var(--card);
    padding:8px 16px;
    border-radius:999px;
    font-weight:500;
  }
  .lb-btn:hover{background:var(--ink); color:var(--wall);}

  footer{
    text-align:center;
    padding:40px 20px 70px;
    border-top:3px double var(--ink);
    max-width:920px;
    margin:0 auto;
  }
  footer p{font-family:var(--serif); font-style:italic; color:var(--ink-soft); font-size:15px;}
  footer .heart{color:var(--crayon-red); font-style:normal;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
    html{scroll-behavior:auto;}
  }
  @media (max-width:560px){
    .wall{gap:44px 24px; padding:28px 18px 70px;}
  }
</style>
</head>
<body>

<header>
  <p class="est">The Permanent Collection · Est. <span id="est-year">2026</span></p>
  <h1><span class="underline" id="artist-name">Maya</span>'s Gallery</h1>
  <p class="subtitle" id="tagline">Original works in crayon, marker, watercolor, and glitter glue. All pieces from the artist's private studio (the kitchen table).</p>
  <p class="now-showing">Now showing · <b id="piece-count">0</b> works</p>
</header>

<nav class="filters" id="filters" aria-label="Filter artworks"></nav>

<main class="wall" id="wall"></main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork detail">
  <div class="lb-inner">
    <div class="lb-media" id="lb-media"></div>
    <div class="lb-caption" id="lb-caption"></div>
    <div class="lb-controls">
      <button class="lb-btn" id="lb-prev">&larr; Previous</button>
      <button class="lb-btn" id="lb-close">Close</button>
      <button class="lb-btn" id="lb-next">Next &rarr;</button>
    </div>
  </div>
</div>

<footer>
  <p>Curated with <span class="heart">&hearts;</span> by Dad. New acquisitions arrive monthly.</p>
</footer>

<script>
/* ==========================================================================
   EDIT THIS SECTION — everything the site shows lives here.
   ========================================================================== */

const CONFIG = {
  artistName: "Hana",              // ← your daughter's name
  establishedYear: 2026,           // year the gallery opened
  tagline: "Original works in crayon, marker, watercolor, and glitter glue. All pieces from the artist's private studio (the kitchen table)."
};

/* Demo placeholder "drawings" — delete this block and swap src values for real files. */
function DEMO_SVG(inner, bg){
  return "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'>
      <rect width='400' height='300' fill='${bg}'/>
      <g stroke-linecap='round' stroke-linejoin='round' fill='none'>${inner}</g>
    </svg>`);
}
var DEMO = {
  sun: DEMO_SVG(`
    <circle cx='200' cy='140' r='58' fill='#F5C31D' stroke='#E8A012' stroke-width='6'/>
    <path d='M200 55 200 25 M200 225 200 255 M115 140 85 140 M285 140 315 140 M140 80 118 58 M260 80 282 58 M140 200 118 222 M260 200 282 222' stroke='#E8A012' stroke-width='8'/>
    <circle cx='182' cy='130' r='6' fill='#26241F'/><circle cx='218' cy='130' r='6' fill='#26241F'/>
    <path d='M175 158 Q200 180 225 158' stroke='#26241F' stroke-width='6'/>`, '#EAF4FB'),
  house: DEMO_SVG(`
    <path d='M110 150 L200 80 L290 150' stroke='#E64832' stroke-width='10'/>
    <rect x='125' y='150' width='150' height='100' stroke='#2E7DB2' stroke-width='8' fill='#FFF7E0'/>
    <rect x='150' y='170' width='30' height='30' stroke='#2E7DB2' stroke-width='6'/>
    <rect x='220' y='170' width='30' height='30' stroke='#2E7DB2' stroke-width='6'/>
    <rect x='185' y='200' width='32' height='50' stroke='#3E9B57' stroke-width='6' fill='#3E9B57' fill-opacity='.3'/>
    <path d='M60 250 L340 250' stroke='#3E9B57' stroke-width='8'/>
    <circle cx='330' cy='60' r='22' fill='#F5C31D'/>`, '#F2FAF0'),
  cat: DEMO_SVG(`
    <ellipse cx='200' cy='190' rx='70' ry='55' stroke='#26241F' stroke-width='7' fill='#F5C31D' fill-opacity='.5'/>
    <circle cx='200' cy='110' r='45' stroke='#26241F' stroke-width='7' fill='#F5C31D' fill-opacity='.5'/>
    <path d='M168 80 L160 45 L190 68 M232 80 L240 45 L210 68' stroke='#26241F' stroke-width='7' fill='#F5C31D'/>
    <circle cx='185' cy='105' r='5' fill='#26241F'/><circle cx='215' cy='105' r='5' fill='#26241F'/>
    <path d='M195 122 Q200 128 205 122 M200 128 200 135 M155 115 120 108 M155 125 120 128 M245 115 280 108 M245 125 280 128' stroke='#26241F' stroke-width='4'/>
    <path d='M265 200 Q305 180 295 145' stroke='#26241F' stroke-width='7'/>`, '#FBEFEA'),
  rainbow: DEMO_SVG(`
    <path d='M80 240 A120 120 0 0 1 320 240' stroke='#E64832' stroke-width='14'/>
    <path d='M100 240 A100 100 0 0 1 300 240' stroke='#F5C31D' stroke-width='14'/>
    <path d='M120 240 A80 80 0 0 1 280 240' stroke='#3E9B57' stroke-width='14'/>
    <path d='M140 240 A60 60 0 0 1 260 240' stroke='#2E7DB2' stroke-width='14'/>
    <ellipse cx='85' cy='245' rx='38' ry='20' fill='white' stroke='#C8D8E4' stroke-width='4'/>
    <ellipse cx='318' cy='245' rx='38' ry='20' fill='white' stroke='#C8D8E4' stroke-width='4'/>`, '#EAF4FB'),
  flowers: DEMO_SVG(`
    <path d='M100 260 100 190 M200 260 200 175 M300 260 300 195' stroke='#3E9B57' stroke-width='8'/>
    <g fill='#E64832'><circle cx='100' cy='170' r='16'/><circle cx='82' cy='185' r='16'/><circle cx='118' cy='185' r='16'/><circle cx='100' cy='198' r='16'/></g>
    <circle cx='100' cy='184' r='11' fill='#F5C31D'/>
    <g fill='#2E7DB2'><circle cx='200' cy='155' r='16'/><circle cx='182' cy='170' r='16'/><circle cx='218' cy='170' r='16'/><circle cx='200' cy='183' r='16'/></g>
    <circle cx='200' cy='169' r='11' fill='#F5C31D'/>
    <g fill='#F5C31D'><circle cx='300' cy='175' r='16'/><circle cx='282' cy='190' r='16'/><circle cx='318' cy='190' r='16'/><circle cx='300' cy='203' r='16'/></g>
    <circle cx='300' cy='189' r='11' fill='#E64832'/>`, '#F2FAF0'),
  abstract: DEMO_SVG(`
    <path d='M60 220 Q120 80 180 190 T310 120' stroke='#E64832' stroke-width='12'/>
    <path d='M70 120 Q160 240 250 140 T340 220' stroke='#2E7DB2' stroke-width='12'/>
    <path d='M90 70 Q200 160 320 70' stroke='#F5C31D' stroke-width='12'/>
    <circle cx='120' cy='230' r='14' fill='#3E9B57'/>
    <circle cx='290' cy='210' r='10' fill='#E64832'/>
    <circle cx='250' cy='70' r='12' fill='#2E7DB2'/>`, '#FFFDF5')
};

/*
  HOW TO ADD A NEW PIECE (monthly routine):
  1. Put the photo/scan in an /art folder next to this file (e.g. art/rainbow.jpg)
  2. Copy one of the blocks below, paste it at the TOP of the list, and fill it in.

  Fields:
    type:     "image" | "video-youtube" | "video-file"
    src:      "art/rainbow.jpg"  (image or video file path)
              or the YouTube video ID e.g. "dQw4w9WgXcQ" for video-youtube
    poster:   (videos only, optional) thumbnail image path
    title:    what she calls it
    medium:   e.g. "Crayon on printer paper" — museum-style
    date:     e.g. "March 2026 · age 5"
    category: "Drawings" | "Paintings" | "Crafts" | "Videos"  (or invent new ones — filters build themselves)
    note:     (optional) the story behind it, shown in the detail view
*/

const ARTWORKS = [
  {
    type: "image",
    src: "art/2026-02-yum-hot-dog.jpg",
    title: "Yum! Hot Dog",
    medium: "Marker on paper",
    date: "February 2026",
    category: "Drawings",
    note: "A kawaii hot dog with milkshake and bacon. The speech bubble says it all."
  },
  {
    type: "image",
    src: "art/2026-01-rainbow-love.jpg",
    title: "Rainbow Love",
    medium: "Marker on paper",
    date: "January 2026",
    category: "Drawings",
    note: "A rainbow arch with a smiling friend inside, plus hearts and a sun."
  }

  /* --- Video example: uncomment and fill in ---
  ,{
    type: "video-youtube",
    src: "YOUTUBE_VIDEO_ID",
    poster: "art/dance-thumbnail.jpg",
    title: "Studio Tour",
    medium: "Video · 1 min 12 sec",
    date: "August 2026 · age 5",
    category: "Videos",
    note: "The artist walks us through her latest works."
  }
  ,{
    type: "video-file",
    src: "art/painting-timelapse.mp4",
    poster: "art/timelapse-thumb.jpg",
    title: "Painting a Rainbow (Timelapse)",
    medium: "Video · 45 sec",
    date: "August 2026 · age 5",
    category: "Videos"
  }
  --- */
];

/* ==========================================================================
   You shouldn't need to edit below this line.
   ========================================================================== */

/* ---- render ---- */
document.getElementById('artist-name').textContent = CONFIG.artistName;
document.getElementById('est-year').textContent = CONFIG.establishedYear;
document.getElementById('tagline').textContent = CONFIG.tagline;
document.title = CONFIG.artistName + "'s Gallery — A Permanent Collection";

const wall = document.getElementById('wall');
const filtersEl = document.getElementById('filters');
let activeFilter = 'All';
let visible = [];

function catNo(i){ return 'Cat. No. ' + String(ARTWORKS.length - i).padStart(3,'0'); }

function thumbFor(a){
  if (a.type === 'image') return a.src;
  if (a.poster) return a.poster;
  if (a.type === 'video-youtube') return 'https://img.youtube.com/vi/' + a.src + '/hqdefault.jpg';
  return DEMO_SVG('', '#DDD8CC');
}

function renderFilters(){
  const cats = ['All', ...new Set(ARTWORKS.map(a => a.category).filter(Boolean))];
  filtersEl.innerHTML = '';
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'pill';
    b.textContent = c;
    b.setAttribute('aria-pressed', String(c === activeFilter));
    b.addEventListener('click', () => { activeFilter = c; renderFilters(); renderWall(); });
    filtersEl.appendChild(b);
  });
}

function renderWall(){
  visible = ARTWORKS.map((a,i)=>({...a, _i:i}))
                    .filter(a => activeFilter === 'All' || a.category === activeFilter);
  wall.innerHTML = '';
  visible.forEach((a, vi) => {
    const card = document.createElement('button');
    card.className = 'art-card';
    card.setAttribute('aria-label', 'View ' + a.title);
    const isVideo = a.type !== 'image';
    card.innerHTML = `
      <div class="frame">
        <img class="thumb" src="${thumbFor(a)}" alt="${a.title}" loading="lazy">
        ${isVideo ? `<span class="video-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>` : ''}
      </div>
      <div class="placard">
        <div class="cat">${catNo(a._i)}${a.category ? ' · ' + a.category : ''}</div>
        <div class="title">${a.title}</div>
        <div class="medium">${a.medium || ''}${a.date ? ' — ' + a.date : ''}</div>
      </div>`;
    card.addEventListener('click', () => openLightbox(vi));
    wall.appendChild(card);
  });
  document.getElementById('piece-count').textContent = ARTWORKS.length;
}

/* ---- lightbox ---- */
const lb = document.getElementById('lightbox');
const lbMedia = document.getElementById('lb-media');
const lbCaption = document.getElementById('lb-caption');
let lbIndex = 0;
let lastFocus = null;

function openLightbox(vi){
  lbIndex = vi;
  lastFocus = document.activeElement;
  showPiece();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('lb-close').focus();
}
function closeLightbox(){
  lb.classList.remove('open');
  lbMedia.innerHTML = '';
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}
function showPiece(){
  const a = visible[lbIndex];
  if (!a) return;
  if (a.type === 'image'){
    lbMedia.innerHTML = `<img src="${a.src}" alt="${a.title}">`;
  } else if (a.type === 'video-youtube'){
    lbMedia.innerHTML = `<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${a.src}" title="${a.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  } else {
    lbMedia.innerHTML = `<div class="video-wrap"><video src="${a.src}" ${a.poster ? `poster="${a.poster}"` : ''} controls></video></div>`;
  }
  lbCaption.innerHTML = `
    <div class="cat">${catNo(a._i)}${a.category ? ' · ' + a.category : ''}</div>
    <h2>${a.title}</h2>
    <div class="medium">${a.medium || ''}${a.date ? ' — ' + a.date : ''}</div>
    ${a.note ? `<p class="note">${a.note}</p>` : ''}`;
  document.getElementById('lb-prev').disabled = lbIndex === 0;
  document.getElementById('lb-next').disabled = lbIndex === visible.length - 1;
}
document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => { if (lbIndex > 0){ lbIndex--; showPiece(); }});
document.getElementById('lb-next').addEventListener('click', () => { if (lbIndex < visible.length - 1){ lbIndex++; showPiece(); }});
lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft' && lbIndex > 0){ lbIndex--; showPiece(); }
  if (e.key === 'ArrowRight' && lbIndex < visible.length - 1){ lbIndex++; showPiece(); }
});

renderFilters();
renderWall();
</script>
</body>
</html>
